name: Dragon Rage opt3 - APK e testes
on:
  push:
    branches: [main, 'codex/opt3*']
    paths: ['opt2.patch', 'opt3.patch', 'scripts/apply_opt3.py', 'tests/**', '.github/workflows/opt3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dragonrage-opt3-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned upstream
        run: |
          git clone --depth 1 --branch android-v0.9.0 https://github.com/dfdx047/Tenkaichi3DecompAndroid.git upstream
          test "$(git -C upstream rev-parse HEAD)" = e1b9207a0ed66dd735cf84f52959cac1cb328a2b
      - name: Apply opt3 and run sanitizers
        run: |
          python3 scripts/apply_opt3.py upstream
          sh tests/run.sh upstream 2>&1 | tee tests.log
          python3 tests/optical_pacing_test.py upstream | tee -a tests.log
          python3 tests/optical_menu_test.py upstream | tee -a tests.log
      - name: Install Vulkan test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools spirv-tools libvulkan-dev mesa-vulkan-drivers
      - uses: actions/cache@v4
        with:
          path: .cache/opt3-sdl
          key: dragonrage-opt3-sdl-3.4.12-v1
      - name: Build pinned SDL for host GPU tests
        run: |
          if [ ! -f .cache/opt3-sdl/build/libSDL3.so ]; then
            mkdir -p .cache/opt3-sdl
            curl -fLsS --retry 3 https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-3.4.12.tar.gz -o /tmp/sdl3-opt3.tar.gz
            echo 'f07b958a9ac5020fb7a44cadb957f658b2149c3c8abb4f63145fac9303249db7  /tmp/sdl3-opt3.tar.gz' | sha256sum -c -
            tar --no-same-owner -xzf /tmp/sdl3-opt3.tar.gz -C .cache/opt3-sdl
            cmake -S .cache/opt3-sdl/SDL3-3.4.12 -B .cache/opt3-sdl/build -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_AUDIO=OFF -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_CAMERA=OFF -DSDL_RENDER=OFF -DSDL_INSTALL=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON -DCMAKE_BUILD_TYPE=Release > /tmp/sdl3-config.log 2>&1 || { tail -80 /tmp/sdl3-config.log; exit 1; }
            cmake --build .cache/opt3-sdl/build -j4 > /tmp/sdl3-build.log 2>&1 || { tail -80 /tmp/sdl3-build.log; exit 1; }
          fi
      - name: Execute real optical GPU graph on Vulkan lavapipe
        run: |
          export DR_FG_SDL_ROOT="$PWD/.cache/opt3-sdl/build"
          export DR_FG_SDL_INCLUDE="$PWD/.cache/opt3-sdl/SDL3-3.4.12/include"
          export VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name '*lvp*' | head -1)
          test -n "$VK_DRIVER_FILES"
          sh tests/optical_gpu_test.sh upstream 2>&1 | tee optical.log
      - name: Package complete modified source
        run: |
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('output/Dragon-Rage-0.9.0-opt3-source.zip','w',ZIP_DEFLATED) as z:
              for p in sorted(Path('upstream').rglob('*')):
                  if p.is_file() and '.git' not in p.parts:
                      z.write(p, Path('Dragon-Rage-0.9.0-opt3-source') / p.relative_to('upstream'))
          PY
      - name: Preserve verified original BT4 components
        run: |
          curl -fL --retry 4 -o /tmp/DragonRage-original.apk https://github.com/dfdx047/Tenkaichi3DecompAndroid/releases/download/android-v0.9.0/DragonRage-0.9.0.apk
          echo 'b1b36d179c90f4018188cbaa10c4e0dde6a8043543abcbb2ddc7aa193a48d53d  /tmp/DragonRage-original.apk' | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('/tmp/DragonRage-original.apk') as apk:
              for name in apk.namelist():
                  if name.startswith('assets/bt4gsx/') and not name.endswith('/'):
                      dest=Path('upstream/android/app/src/main')/name
                  elif name in ('lib/arm64-v8a/libbt4.so','lib/arm64-v8a/libbt4gsx.so'):
                      dest=Path('upstream/android/app/src/main/jniLibs/arm64-v8a')/name.split('/')[-1]
                  else: continue
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(apk.read(name))
          PY
      - uses: actions/cache@v4
        with:
          path: upstream/port/build/android-toolchain/llvm
          key: dragonrage-llvm-21.1.0
      - name: Build native BT3 engine and loader
        working-directory: upstream
        env:
          BT3_SKELETON: '1'
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh port/tools/android_toolchain.sh
          python3 port/tools/android.py > ../engine.log 2>&1 || { tail -100 ../engine.log; exit 1; }
          tail -20 ../engine.log
          grep -q '^installed into' ../engine.log
          if grep -Eq 'GsPerf_|DrOptical_|GsVkOptical_' port/build/android/stubs.txt; then
            echo 'Missing opt3 runtime export'; exit 1
          fi
      - name: Build signed APK
        working-directory: upstream/android
        env:
          DR_VERSION_NAME: 0.9.0-opt3
          DR_VERSION_CODE: '58'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease > ../../gradle.log 2>&1 || { tail -100 ../../gradle.log; exit 1; }
          tail -20 ../../gradle.log
      - name: Verify signature and APK contents
        run: |
          cp upstream/android/app/build/outputs/apk/release/app-release.apk output/Dragon-Rage-0.9.0-opt3.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs output/Dragon-Rage-0.9.0-opt3.apk | tee output/APK-verification.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging output/Dragon-Rage-0.9.0-opt3.apk > output/APK-metadata.txt
          head -1 output/APK-metadata.txt
          grep -q "versionName='0.9.0-opt3'" output/APK-metadata.txt
          grep -q "versionCode='58'" output/APK-metadata.txt
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib
          with ZipFile('output/Dragon-Rage-0.9.0-opt3.apk') as z, ZipFile('/tmp/DragonRage-original.apk') as original:
              for name in ('lib/arm64-v8a/libbt3.so','lib/arm64-v8a/libbt4.so','lib/arm64-v8a/libbt4gsx.so','lib/arm64-v8a/libSDL3.so'):
                  assert z.getinfo(name).file_size>1000000,name
              for name in z.namelist():
                  if name.startswith('assets/bt4gsx/') or name in ('lib/arm64-v8a/libbt4.so','lib/arm64-v8a/libbt4gsx.so'):
                      assert z.read(name)==original.read(name),name
              for export in (b'GsPerf_SetThermal',b'GsPerf_SetMemoryPressure',b'GsPerf_SetRefreshMilliHz',b'GsPerf_Tick',b'DrOptical_Capture',b'DrOptical_Image',b'GsVkOptical_Present'):
                  assert export in z.read('lib/arm64-v8a/libbt3.so'),export
              assert z.read('assets/licenses/win-fg-LICENSE.txt')
              print('APK signature verified; rebuilt BT3; BT4 and its resources identical to verified upstream APK')
          PY
          cp tests.log optical.log output/
          cd output
          sha256sum Dragon-Rage-*.apk Dragon-Rage-*-source.zip > SHA256SUMS.txt
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Rage-0.9.0-opt3-APK
          path: output/
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Rage-opt3-build-logs
          path: |
            engine.log
            gradle.log
            tests.log
            optical.log
            upstream/port/build/android/stubs.txt
