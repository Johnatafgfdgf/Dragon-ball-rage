name: Compilar Dragon Rage opt1
on:
  push:
    branches: [main]
    paths: [.github/workflows/build.yml, scripts/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch clean upstream source
        run: |
          git clone --depth 1 --branch android-v0.9.0 https://github.com/dfdx047/Tenkaichi3DecompAndroid.git upstream
      - name: Apply mobile memory optimization
        run: |
          cp scripts/apply_opt1.py upstream/
          cd upstream
          python3 apply_opt1.py
          cc -std=c11 -Wall -Wextra -Werror -D__ANDROID__ -x c -o /tmp/test_cache - <<'C'
          #include "port/src/gs/gs_texpack_budget.h"
          int main(void) {
            return TexPack_DefaultBudgetBytes(2048) != ((size_t)64 << 20) ||
                   TexPack_DefaultBudgetBytes(8192) != ((size_t)256 << 20);
          }
          C
          /tmp/test_cache
      - name: Get original BT4 components (release checksum verification)
        run: |
          curl -fL --retry 4 -o /tmp/DragonRage-original.apk "https://github.com/dfdx047/Tenkaichi3DecompAndroid/releases/download/android-v0.9.0/DragonRage-0.9.0.apk"
          echo 'b1b36d179c90f4018188cbaa10c4e0dde6a8043543abcbb2ddc7aa193a48d53d  /tmp/DragonRage-original.apk' | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk = ZipFile('/tmp/DragonRage-original.apk')
          root = Path('upstream/android/app/src/main')
          copied = []
          for name in apk.namelist():
              if name.startswith('assets/bt4gsx/') and not name.endswith('/'):
                  dest = root / name
              elif name in ('lib/arm64-v8a/libbt4.so', 'lib/arm64-v8a/libbt4gsx.so'):
                  dest = root / 'jniLibs/arm64-v8a' / name.split('/')[-1]
              else:
                  continue
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(apk.read(name))
              copied.append(name)
          assert 'lib/arm64-v8a/libbt4.so' in copied
          assert 'lib/arm64-v8a/libbt4gsx.so' in copied
          assert len(copied) > 15
          print('Recovered', len(copied), 'BT4 files from verified original APK')
          PY
      - name: Cache LLVM toolchain
        uses: actions/cache@v4
        with:
          path: upstream/port/build/android-toolchain/llvm
          key: dragonrage-llvm-21.1.0
      - name: Build native Android BT3 engine
        working-directory: upstream
        env:
          BT3_SKELETON: '1'
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          test -n "$ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh port/tools/android_toolchain.sh
          python3 port/tools/android.py > /tmp/engine.log 2>&1 || { tail -100 /tmp/engine.log; exit 1; }
          tail -20 /tmp/engine.log
          grep -q '^installed into' /tmp/engine.log || { echo 'Engine installation not confirmed'; exit 1; }
      - name: Build signed Android APK
        working-directory: upstream/android
        env:
          DR_VERSION_NAME: 0.9.0-opt1
          DR_VERSION_CODE: '56'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify and prepare APK
        run: |
          mkdir -p output
          cp upstream/android/app/build/outputs/apk/release/app-release.apk output/Dragon-Rage-0.9.0-opt1.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          f='output/Dragon-Rage-0.9.0-opt1.apk'
          with ZipFile(f) as z:
              for n in ('lib/arm64-v8a/libbt3.so','lib/arm64-v8a/libbt4.so','lib/arm64-v8a/libbt4gsx.so'):
                  assert n in z.namelist() and z.getinfo(n).file_size > 1000000, n
                  print(n, z.getinfo(n).file_size)
          PY
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Rage-0.9.0-opt1-APK
          path: output/
          if-no-files-found: error
